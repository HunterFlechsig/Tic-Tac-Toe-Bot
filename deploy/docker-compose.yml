services:
  backend:
    build:
      context: ..
      dockerfile: deploy/backend.Dockerfile
    ports:
      - "5000:5000"
  frontend:
    build:
      context: ..
      dockerfile: deploy/frontend.Dockerfile
    environment:
      API_URL: http://backend:5000
      PORT: "80"
    ports:
      - "8080:80"
    depends_on:
      - backend
